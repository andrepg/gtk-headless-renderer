name: Build binary

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant.arch }} / GNOME ${{ matrix.gnome }}
    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 90
    container:
      # Imagem oficial do flathub-infra/actions-images.
      # Já contém flatpak + org.gnome.Sdk/Platform da versão indicada.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-${{ matrix.gnome }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        gnome: ["50", "51"]
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Render Flatpak manifest (GNOME ${{ matrix.gnome }})
        shell: bash
        run: |
          set -euo pipefail
          sed "s/@GNOME_VERSION@/${{ matrix.gnome }}/g" \
            .github/flatpak/io.github.andrepg.GtkEmbeddedPreview.yml.in \
            > .github/flatpak/io.github.andrepg.GtkEmbeddedPreview.yml

      - name: Build with Flatpak SDK
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: .github/flatpak/io.github.andrepg.GtkEmbeddedPreview.yml
          arch: ${{ matrix.variant.arch }}
          build-dir: flatpak_app
          repo-dir: flatpak_repo
          build-bundle: false
          upload-artifact: false
          cache: false
          verbose: true

      - name: Collect binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          name="gtk-headless-preview-${{ matrix.variant.arch }}-gnome-${{ matrix.gnome }}"
          mkdir -p dist
          install -Dm755 flatpak_app/files/bin/gtk-headless-preview "dist/$name"
          file "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          cat "dist/$name.sha256"

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v7
        with:
          name: gtk-headless-preview-${{ matrix.variant.arch }}-gnome-${{ matrix.gnome }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gtk-headless-preview-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and create combined manifest
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum -c ./*.sha256
          mapfile -t binaries < <(
            find . -maxdepth 1 -type f -name 'gtk-headless-preview-*' \
              ! -name '*.sha256' -printf '%f\n' | sort
          )
          (( ${#binaries[@]} == 4 ))
          chmod +x "${binaries[@]}"
          sha256sum "${binaries[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Delete temporary artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: gtk-headless-preview-*
          failOnError: false
